# ─────────────────────────────────────────────────────────────────────────────
# Automerge policy.
#
# The presence of this file is what enrols the repo. Delete it and automerge
# stops, with no workflow edit needed.
#
# It is always read from the DEFAULT BRANCH, never from a PR head, so a pull
# request cannot ship a policy that grants itself permission to be merged.
#
# See docs/AUTOMERGE.md in datarobot-oss/github-actions for the full picture,
# and note the one rule that matters: the ruleset is the enforcer, this file is
# an EXTRA gate on top of it. `main` carries required_status_checks with an
# empty bypass list, so nothing here can cause a failing PR to merge.
#
# Wiring cve-sync into this file: the enroll-automerge skill in cve-sync.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Spelled with the `[bot]` suffix, exactly. Authors are compared with no
# normalization, and a mismatch is SILENT: the PR is not a candidate at all, so
# it gets no comment and no hand-over.
#
# Dependabot enrolled first (#712), cve-sync[bot] 2026-10-07, one at a time so a
# surprise has an obvious source.
#
# dr-auto-merge checks the author of EVERY COMMIT, not just who opened the PR.
# cve-sync before 0.0.67 wrote its commits as `github-actions[bot]`, which is
# what held cve-sync back here at first. This repo calls the resync at `@main`,
# so it has the fix: #738 carries only `cve-sync[bot]` commits. Do NOT "fix" a
# recurrence by adding `github-actions[bot]` here. That would trust every
# workflow in the repo.
#
# ACCEPTED RISK, recorded so nobody "fixes" it back. A cve-sync PR here bumps
# `[project].version`, and that bump IS the release decision:
# release-on-merge.yml tags whatever version pyproject.toml carries and
# dispatches publish-pypi.yml, whose `Release` environment has no required
# reviewers. So a cve-sync PR that merges itself also publishes to PyPI
# unattended. There is no way to split the two without leaving the CVE fix
# unreleased, which defeats the resync.
#
# cve-sync decides for itself whether a resync is boring enough to carry the
# `automerge` label at all, reading the uv.lock diff to do it: a major version
# crossing, a package entering or leaving the resolution, or a removed ceiling
# all get `00 - Ready for Review` instead. That is upstream of this policy, not
# a substitute for it.
allowed_authors:
  - dependabot[bot]
  - cve-sync[bot]

label: automerge

# ─────────────────────────────────────────────────────────────────────────────
# Each of these must be PRESENT and green. Not "not failing": present. A PR
# where a suite never ran at all is refused.
#
# THE LIST IS FOUR NAMES, NOT THIRTY-SIX, AND THAT IS DELIBERATE. CI on this
# repo expands to 33 matrix contexts (3 python versions x 9 modules, plus lint
# and build-test per version). Listing all of them would buy nothing and break
# constantly: adding or renaming a module silently invalidates the list, and a
# stale expected check means the PR waits for a human forever.
#
# `security` is the sentinel instead. It is ci.yml's only non-matrix job, so its
# name is stable, and it cannot report unless ci.yml itself ran. If ci.yml ran,
# the whole 33-job matrix ran with it, and `block_on_any_failure` below catches
# any one of them that goes red. So this list answers "did CI run at all", and
# that flag answers "did anything that ran fail".
#
# This is also why the workflows need no gate jobs and no `if: always()`
# scaffolding: presence is checked HERE rather than by the ruleset. Listing a
# check here is safe in a way that REQUIRING it is not. A required context a PR
# never fires wedges that PR forever; a missing expected check just means the PR
# waits for a human instead of self-merging.
#
# WHY THESE FOUR ARE GUARANTEED TO FIRE on either bot's PR, verified by reading
# each workflow's triggers: none of the four carries a path filter, none
# carries an actor guard, and none reads anything but `secrets.GITHUB_TOKEN`,
# which is the one secret a Dependabot event can still resolve. One list serves
# both authors, since there is no per-author scoping.
#
# `changelog-check` and `version-check` mostly PASS rather than do work here.
# On a Dependabot bump both exempt the PR: changelog-check skips a diff
# confined to `.github/`, and version-check skips any diff that does not touch
# `src/datarobot_genai/`. A cve-sync resync satisfies changelog-check for real,
# because `stamps-release: true` writes a CHANGELOG.md entry, and is exempted by
# version-check. Listing them proves they ran and reached that verdict, rather
# than never having run.
#
# DELIBERATELY ABSENT, verified the same way:
# - `e2e / *`, `e2e-examples` - both suites now skip the `dependabot[bot]`
#                        actor, and have to. Their `core` path filters include
#                        their own workflow file, so a grouped actions bump
#                        WOULD have triggered them, and they read E2E_* Actions
#                        secrets that a Dependabot event resolves to empty. They
#                        would have failed on auth on every single bump. They
#                        run on the push to `main` after the merge instead.
#                        A cve-sync PR does run them (the App resolves secrets
#                        normally), and `block_on_any_failure` holds a red one
#                        to account, but one list serves both authors.
# - `drmcp-integration` - fires only when its paths-filter matches, which for a
#                        bump means only when integration.yml itself was
#                        touched. It needs no credentials, so when it does fire
#                        it is real coverage and `block_on_any_failure` holds it
#                        to account. It just cannot be relied on to be there.
# - `detect-changes`   - the name is ambiguous. Three workflows define a job
#                        called exactly that.
# - release / publish  - release-on-merge.yml, docs_publish.yml and the two
#                        publish workflows are push, tag or comment triggered,
#                        so they never report on a PR.
# - `backport`         - workflow-backport.yaml runs on closed/labeled PRs.
# - PR-automation jobs - workflow-pr-automation.yaml's helpers fire on label and
#                        review events a bot PR may never raise.
#
# That leaves a real gap: an actions bump merges without E2E having run on it.
# The 33-job CI matrix, which does run in full, is the deliberate stand-in.
#
# If a name here is wrong the PR refuses to merge and escalates rather than
# merging unverified, so the failure direction is safe. Watch the first live
# verdict anyway.
# ─────────────────────────────────────────────────────────────────────────────
expected_checks:
  # ci.yml's presence sentinel. See above: this one name stands in for all 33.
  - "security"
  # Both pass by exemption on this PR shape, not by doing work. Listed so that
  # "exempted" is distinguishable from "never ran".
  - "changelog-check"
  - "version-check"
  # Already required by the `main` ruleset and added automatically from the
  # branch rules API. Repeated anyway: if someone edits the ruleset and drops
  # it, this file still holds the line.
  - "gate / cve-sync gate"

# Refuse when ANY check is failing, including ones neither required nor listed.
# `skipped` and `neutral` count as a pass. This is what covers the 33 CI
# contexts that `expected_checks` deliberately does not name, and it is why the
# short list above is safe.
block_on_any_failure: true

# Cursor Bugbot reviews this repo (e.g. #737) and reports through a review
# comment rather than a check, so without this flag its findings are
# decorative: a PR can carry a high-severity finding and still merge itself
# with everything green. Only OPEN threads block; resolving the conversation,
# or changing the code so the thread goes outdated, clears it. Needs
# github-actions 0.0.29 or later in the caller.
block_on_cursor_comments: true

settle_seconds: 300

# Sized for the larger of the two bots, which is Dependabot: a grouped
# github-actions bump touches one file per workflow that pins an action. There
# are 16 workflows here and almost all of them pin `actions/checkout`, so 16 is
# the realistic ceiling today and 20 leaves room for a few more. A cve-sync
# resync is nowhere near it: 10 files at absolute worst.
max_changed_files: 20

# The union of what both bots touch. dr-auto-merge has no per-author path rules,
# so anything either bot needs is allowed for both.
#
# Dependabot's half is the `.github/` entries. It is scoped to the
# github-actions ecosystem at `/`, and there is no `.github/actions/` directory
# here; add `.github/actions/**` at the same time as adding one.
#
# cve-sync's half is the rest. This repo has three resolution roots (the
# package, `docs`, `e2e-tests`), each with its own manifest and lock. `setup.py`
# is on it because the extras live there and the resync raises floors in them
# (#738). CHANGELOG.md is the entry `stamps-release: true` writes.
# `.taskfiles/cve-sync.yml` is the vendored command file the resync rewrites
# from the upstream definition; it rarely moves, which makes it easy to forget.
# Each entry is spelled out rather than globbed: a resync has no business
# touching anything else, and if one ever does, this hands the PR to a person.
allowed_paths:
  - ".github/workflows/**"
  - ".github/dependabot.yml"
  - ".taskfiles/cve-sync.yml"
  - "CHANGELOG.md"
  - "pyproject.toml"
  - "uv.lock"
  - "setup.py"
  - "docs/pyproject.toml"
  - "docs/uv.lock"
  - "e2e-tests/pyproject.toml"
  - "e2e-tests/uv.lock"

# `main review` allows squash only; any other method is refused by GitHub.
merge_method: squash

# ─────────────────────────────────────────────────────────────────────────────
# What happens when automerge gives up.
#
# Transient refusals (checks still running, settling, branch behind base) just
# wait for the next poll. Terminal ones do not: a red check never goes green on
# its own, and a PR touching files outside `allowed_paths` never will.
#
# On a terminal refusal the bot drops the `automerge` label, applies the label
# below, and posts a new comment explaining why. Dropping `automerge` is what
# makes that happen exactly once: the PR stops being a candidate.
#
# `00 - Ready for Review` puts the PR into the normal review queue. Because the
# label is applied with the App token rather than GITHUB_TOKEN, it also
# triggers workflow-pr-automation.yaml's Slack ping, so somebody actually hears
# about it.
#
# cve-sync applies this same label itself, before anything has run, when it
# decides a change is not one a green check run settles. Same destination, two
# routes, and a reviewer can tell which by where the reason is: in the PR body
# means cve-sync refused up front, in a comment means dr-auto-merge gave up
# after the fact.
# ─────────────────────────────────────────────────────────────────────────────
escalate_label: "00 - Ready for Review"
