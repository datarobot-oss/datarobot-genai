name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TASK_VERSION: 3.48.0

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache uv download cache
        uses: actions/cache@v4
        with:
          # Cache only uv's content-addressed download cache, not .venv. Caching
          # .venv across the shared key let a stale/cross-module environment be
          # restored, which `uv sync` then reconciled incorrectly (e.g. the
          # drmcpbase extra losing the datarobot SDK). The venv is rebuilt from
          # this cache by `uv sync` on every run, which is fast and always correct.
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Lint (ruff format/check)
        run: |
          task check-ruff-format
          task check-ruff

      - name: Type check (mypy)
        run: |
          task mypy

      - name: Check import restrictions
        run: |
          task check-imports

  test-module:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
        module: [ 'core', 'crewai', 'langgraph', 'llamaindex', 'drmcpbase', 'drmcputils', 'drmcp', 'dragent', 'eval']
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache uv download cache
        uses: actions/cache@v4
        with:
          # Cache only uv's content-addressed download cache, not .venv. Caching
          # .venv across the shared key let a stale/cross-module environment be
          # restored, which `uv sync` then reconciled incorrectly (e.g. the
          # drmcpbase extra losing the datarobot SDK). The venv is rebuilt from
          # this cache by `uv sync` on every run, which is fast and always correct.
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv sync --extra ${{ matrix.module }} --dev

      - name: Run tests
        run: |
          MODULE=${{ matrix.module }} task test-module

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}-module-${{ matrix.module }}
          path: test_results/test-results.xml
          if-no-files-found: ignore

  # drmcp supports FastMCP 3 and 4. The lock stays on FastMCP 3, because FastMCP 4 needs
  # mcp 2 and other extras (crewai, langgraph, dragent) still pin mcp 1. So this job
  # installs drmcp alone, outside the lock, with FastMCP 4 and mcp 2.
  test-fastmcp4:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install drmcp with FastMCP 4
        run: |
          uv venv -p ${{ matrix.python-version }}
          printf 'fastmcp>=4.0.9,<5\nmcp>=2,<3\n' > "$RUNNER_TEMP/fastmcp4.txt"
          # --no-config skips this repo's [tool.uv] overrides, which pin mcp<2.
          uv pip install --no-config --override "$RUNNER_TEMP/fastmcp4.txt" -e ".[drmcp]" --group dev

      - name: Run drmcp and drmcpbase tests
        run: |
          mkdir -p test_results
          .venv/bin/python -m pytest tests/drmcp -vv \
            --ignore=tests/drmcp/integration --ignore=tests/drmcp/acceptance \
            --junitxml=test_results/test-results-drmcp.xml
          .venv/bin/python -m pytest tests/drmcpbase -vv --confcutdir=tests/drmcpbase \
            --junitxml=test_results/test-results-drmcpbase.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}-fastmcp4
          path: test_results/
          if-no-files-found: ignore

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache uv download cache
        uses: actions/cache@v4
        with:
          # Cache only uv's content-addressed download cache, not .venv. Caching
          # .venv across the shared key let a stale/cross-module environment be
          # restored, which `uv sync` then reconciled incorrectly (e.g. the
          # drmcpbase extra losing the datarobot SDK). The venv is rebuilt from
          # this cache by `uv sync` on every run, which is fast and always correct.
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run all tests
        run: |
          task test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}-all
          path: test_results/test-results.xml
          if-no-files-found: ignore

      - name: License check
        run: |
          task check-licenses

      - name: Build package
        run: |
          uv build

      - name: Validate package metadata
        run: |
          uv run python -m twine check dist/*

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv download cache
        uses: actions/cache@v4
        with:
          # Cache only uv's content-addressed download cache, not .venv (see note above).
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
