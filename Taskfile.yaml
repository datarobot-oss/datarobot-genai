---
# https://taskfile.dev
version: '3'

dotenv: [".env"]

env:
  PARENT_ENV: true

vars:
  PROJECT_SRC: "./src"
  TESTS_SRC: "./tests"

includes:
  lint:
    taskfile: .taskfiles/lint.yml
    flatten: true
  license:
    taskfile: .taskfiles/license.yml
    flatten: true
  env:
    taskfile: .taskfiles/env.yml
    flatten: true
  tests:
    taskfile: .taskfiles/tests.yml
    flatten: true
  release:
    taskfile: .taskfiles/release.yml
    flatten: true
  drmcp:
    taskfile: .taskfiles/drmcp.yml
    flatten: true
  dev:
    taskfile: .taskfiles/dev.yml
    flatten: true
  cve-sync:
    taskfile: .taskfiles/cve-sync.yml

tasks:
  install:
    desc: "🔧 Install dependencies (all extras)"
    cmds:
      - echo "🔧 Installing dependencies (all extras)..."
      - uv sync --all-extras --dev
    silent: true

  bump:
    desc: "Bump the patch version in pyproject.toml and every uv.lock"
    cmds:
      - uv run --no-project python scripts/version_bump.py bump patch
    silent: true

  bump-minor:
    desc: "Bump the minor version in pyproject.toml and every uv.lock"
    cmds:
      - uv run --no-project python scripts/version_bump.py bump minor
    silent: true

  rebase:
    desc: "Rebase onto origin/main without version and CHANGELOG conflicts, then re-bump"
    cmds:
      - uv run --no-project python scripts/version_bump.py rebase --base {{.BASE | default "origin/main"}}
    silent: true

  rebase-continue:
    desc: "Continue `task rebase` after resolving a conflict"
    cmds:
      - uv run --no-project python scripts/version_bump.py continue
    silent: true

  rebase-abort:
    desc: "Abandon `task rebase` and restore the branch as it was"
    cmds:
      - uv run --no-project python scripts/version_bump.py abort
    silent: true

  build:
    desc: "Build distribution packages"
    cmds:
      - echo "Building distribution packages..."
      - rm -rf dist/
      - uv build
      - echo "Build complete! Distribution files in dist/"

  docs-serve:
    silent: true
    desc: "Serve documentation site locally"
    dir: docs
    cmds:
      - uv sync
      - uv run properdocs serve

  docs-build:
    silent: true
    desc: "Build documentation site"
    dir: docs
    cmds:
      - uv sync
      - uv run properdocs build
