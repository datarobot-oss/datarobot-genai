[project]
name = "datarobot-genai-docs"
version = "0.1.0"
description = "Documentation for DataRobot GenAI Library"
requires-python = ">=3.11"
dependencies = [
    "properdocs>=1.6.7",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "datarobot-genai",
]

[tool.uv]
# cve-sync:begin
constraint-dependencies = [
    "click>=8.3.3",
    "idna>=3.15",
    "pygments>=2.20.0",
    "pymdown-extensions>=11.0.1",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
# cve-sync:end

[tool.uv.sources]
datarobot-genai = { path = "../", editable = true }
