[project]
name = "datarobot-genai-docs"
version = "0.1.0"
description = "Documentation for DataRobot GenAI Library"
requires-python = ">=3.11"
dependencies = [
    "properdocs>=1.6.7",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "datarobot-genai",
]

[tool.uv]
constraint-dependencies = [
    "pip>=26.1.2",
    "pdfminer.six>=20251230",
    "aiohttp>=3.14.1",
    "openai>=2.30.0",
    "langchain>=1.3.9",
    "langsmith>=0.8.18",
    "nltk>=3.9.4",
    "langgraph-checkpoint>=4.1.1",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "joserfc>=1.6.8",
    "soupsieve>=2.8.4",
    "pypdf>=6.14.0",
    "pyarrow>=23.0.1",
    "pillow>=12.2.0",
    "banks>=2.4.2",
    "bleach>=6.4.0",
    "idna>=3.15",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.10",
    "langchain-classic>=1.0.7",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "mistune>=3.3.0",
    "notebook>=7.5.6",
]
override-dependencies = [
    "crewai>=1.11.0",
    "cryptography>=48.0.1",
    "PyJWT>=2.13.0",
    "litellm>=1.91.1,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-sdk>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-common>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0,<2.0.0",
    "opentelemetry-instrumentation>=0.64b0,<0.65",
    "click>=8.3.3",
    "json-repair>=0.60.1",
    "mcp>=1.28.1",
]

[tool.uv.sources]
datarobot-genai = { path = "../", editable = true }
