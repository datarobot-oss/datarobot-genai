general:
  front_end:
    _type: dragent_fastapi
    step_adaptor:
      mode: "off"
    a2a:
      server:
        name: "E2E LlamaIndex Agent"
        description: "LlamaIndex agent for end-to-end testing."
  telemetry:
    tracing:
      otelcollector:
        _type: datarobot_otelcollector
        project: "llamaindex"
        # Export every NAT span immediately (default is 100) so a request's
        # spans drain before the next e2e test resets the shared mock collector.
        batch_size: 1

llms:
  datarobot_llm:
    _type: datarobot-llm-component
    reasoning: true

middleware:
  datarobot_guardrails:
    _type: datarobot_moderation
    moderation:
      guards:
        - name: Prompt Tokens
          description: Track the number of tokens associated with the input to the LLM, and/or
            retrieved text from the vector database.
          ootb_type: token_count
          stage: prompt
          type: ootb
        - name: Response Tokens
          description: Track the number of tokens associated with the output from the LLM,
            and/or retrieved text from the vector database.
          ootb_type: token_count
          stage: response
          type: ootb
      timeout_sec: 60
  datarobot_otel_conventions:
    _type: datarobot_otel_conventions


functions:
  llamaindex_agent:
    _type: llamaindex_agent
    llm_name: datarobot_llm
    description: LlamaIndex planner/writer agent
    verbose: True
    allow_parallel_tool_calls: True
    # One entry per MCP server.
    tool_names:
      - docs
    #   - weather
    #   - analytics

# workflow.yaml says what the agent may reach; `<name>_mcp_*` says where. The join
# is `server.name`.
function_groups:
  docs:
    _type: datarobot_mcp_client
    server:
      # `default` is what MCP_DEPLOYMENT_ID / MCP_WORKLOAD_ID configure.
      name: default
      auth_provider: datarobot_mcp_auth

  # Add a server by setting its variables in .env and uncommenting a block. The entry
  # name is the tool prefix: `weather` gives `weather__get_forecast`.
  #
  #   WEATHER_MCP_DEPLOYMENT_ID=69331f1f30548f83b668d9dc
  #   ANALYTICS_MCP_WORKLOAD_ID=6a72dd6d4417b3136f64fef0
  #   VENDOR_MCP_URL=https://mcp.vendor.example.com/mcp
  #   VENDOR_MCP_HEADERS={"Authorization": "Bearer the-vendors-own-token"}
  #
  # weather:
  #   _type: datarobot_mcp_client
  #   server:
  #     name: weather
  #     auth_provider: datarobot_mcp_auth
  #
  # analytics:
  #   _type: datarobot_mcp_client
  #   server:
  #     name: analytics
  #     auth_provider: datarobot_mcp_auth
  #
  # An externally hosted server sends no DataRobot identity.
  # remote_mcp_server:
  #   _type: datarobot_mcp_client
  #   server:
  #     name: remote_mcp_server
  #     auth_provider: none

authentication:
  datarobot_mcp_auth:
    _type: datarobot_mcp_auth

memory:
  mem0_memory:
    _type: dr_mem0_memory

workflow:
  # When memory is not configured streaming_memory_agent is a passthrough so it is safe to use
  # unconditionally.
  _type: streaming_memory_agent
  inner_agent_name: llamaindex_agent
  memory_name: mem0_memory
  llm_name: datarobot_llm
  description: LlamaIndex planner/writer agent with automatic memory capture and retrieval
  middleware:
    - datarobot_guardrails
    - datarobot_otel_conventions
  save_ai_messages_to_memory: false
  search_params:
    top_k: 5
  add_params:
    async_mode: false
