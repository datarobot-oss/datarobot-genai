# E2E overlay: the custom-model guard authenticated by the caller's token
# (``x-datarobot-external-access-token``) while the configured DATAROBOT_API_TOKEN is invalid.
base: workflow.yaml

middleware:
  datarobot_guardrails:
    _type: datarobot_moderation
    allow_external_access_tokens: true
    moderation:
      timeout_sec: 60
      guards:
        - name: Emotion Classifier
          type: model
          stage: [prompt, response]
          deployment_id: ${EMOTION_CLASSIFIER_DEPLOYMENT_ID}
          model_info:
            input_column_name: text
            target_name: target_PREDICTION
            target_type: TextGeneration
            class_names: [anger, fear, sadness, disgust, joy, neutral]
          intervention:
            action: report
