# E2E overlay for the NIM case. LiteLLM ships no catalog entry for the
# NIM-served model this case runs (gpt-oss-20b), so CrewAI would report no
# tool-calling support and fall back to the ReAct text path. Setting the flag
# here makes it a property of this workflow rather than of the environment.
# The other agents in this case (nat, langgraph, llamaindex) ignore it: only
# the CrewAI NIM client reads it.
base: workflow.yaml

llms:
  datarobot_llm:
    assume_native_tool_calling_when_unmapped: true
