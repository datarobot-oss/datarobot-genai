[project]
name = "datarobot-genai-e2e-tests"
version = "0.1.0"
description = "E2E tests for datarobot-genai"
requires-python = ">=3.11, <3.14"
authors = [{ name = "DataRobot, Inc." }]

dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "pytest",
    "pytest-rerunfailures",
    "pytest-timeout",
    "python-dotenv",
    "nbmake>=1.5.5",
    "pytest-xdist>=3.8.0",
]

[dependency-groups]
dragent-nat = [
    "datarobot-genai[dragent]"
]
dragent-langgraph = [
    "datarobot-genai[dragent,langgraph]"
]
dragent-crewai = [
    "datarobot-genai[dragent,crewai]",
]
dragent-llamaindex = [
    "datarobot-genai[dragent,llamaindex]"
]
dragent-base = [
    "datarobot-genai[dragent]",
]
example-quickstart = [
    "datarobot-genai[langgraph]",
]
dev = [
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "rpdb>=0.2.0",
    "ruff>=0.15.2",
]

[project.entry-points.'nat.plugins']
nat_agent = "dragent.nat.register"
langgraph_agent = "dragent.langgraph.register"
crewai_agent = "dragent.crewai.register"
llamaindex_agent = "dragent.llamaindex.register"
base_agent = "dragent.base.register"

[tool.uv]
package = true
# Declared inline instead of as a [tool.uv.sources] sub-table on purpose. cve-sync
# splices its managed block into [tool.uv], and an out-of-line sub-table there
# strands the begin/end markers behind it, so every `task cve-sync:sync` appends
# another empty marker pair. An inline value keeps the splice idempotent.
sources = { datarobot-genai = { path = "../", editable = true } }
exclude-dependencies = [
    "annoy",
    "build",
    "fastembed",
    "flask",
    "gevent",
    "kubernetes",
    "lancedb",
    "langchain-milvus",
    "leptonai",
    "llama-index-cli",
    "onnxruntime",
    "openpyxl",
    "pyfiglet",
    "pymilvus",
    "python-docx",
    "pytube",
    "shellingham",
    "stagehand",
    "typer",
    "uv",
    "watchdog",
    "wheel",
    "youtube-transcript-api",
]
# cve-sync:begin
constraint-dependencies = [
    "pip>=26.1.2",
    "pdfminer.six>=20251230",
    "aiohttp>=3.14.1",
    "openai>=2.30.0",
    "langchain>=1.3.9",
    "langsmith>=0.8.18",
    "nltk>=3.9.4",
    "langgraph-checkpoint>=4.1.1",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "joserfc>=1.6.8",
    "soupsieve>=2.8.4",
    "pypdf>=6.14.0",
    "pyarrow>=23.0.1",
    "pillow>=12.2.0",
    "banks>=2.4.2",
]
override-dependencies = [
    "crewai>=1.11.0",
    "cryptography>=48.0.1",
    "PyJWT>=2.13.0",
    "litellm>=1.91.1,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-sdk>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-common>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0,<2.0.0",
    "opentelemetry-instrumentation>=0.64b0,<0.65",
]
# cve-sync:end

[tool.mypy]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
pretty = true
show_absolute_path = true

[tool.pytest.ini_options]
timeout = 300

[tool.ruff]
line-length = 100
indent-width = 4

[tool.setuptools]
packages = ["dragent", "drmcp"]

[tool.ruff.lint]
select = [
    "E",  # Pyflakes
    "F",  # pycodestyle
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle
    "PL", # pylint
    "UP", # pyupgrade
    "INP", # check missing __init__.py
    "B006", # mutable-argument-default
]
extend-ignore = [
    # D100-D106: Ignore undocumented module, class, method, function & inner class
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
    # 1 blank line required between summary line and description
    "D205",
    # Too many arguments
    "PLR0913",
    # Too many statements
    "PLR0915",
    # Too many branches
    "PLR0912",
    # inline imports
    "PLC0415",
    # assigning a lambda
    "E731",
]
fixable = [
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "F401", # Imported but unused
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "D104", # Missing docstring in public package
    "F401"  # Imported but unused
]


[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "bytes"]
max-args = 8
