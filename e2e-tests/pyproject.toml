[project]
name = "datarobot-genai-e2e-tests"
version = "0.1.0"
description = "E2E tests for datarobot-genai"
requires-python = ">=3.11, <3.14"
authors = [{ name = "DataRobot, Inc." }]

dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "pytest",
    "pytest-rerunfailures",
    "pytest-timeout",
    "python-dotenv",
    "nbmake>=1.5.5",
    "pytest-xdist>=3.8.0",
]

[dependency-groups]
dragent-nat = [
    "datarobot-genai[dragent]"
]
dragent-langgraph = [
    "datarobot-genai[dragent,langgraph]"
]
dragent-crewai = [
    "datarobot-genai[dragent,crewai]",
]
dragent-llamaindex = [
    "datarobot-genai[dragent,llamaindex]"
]
dragent-base = [
    "datarobot-genai[dragent]",
]
example-quickstart = [
    "datarobot-genai[langgraph]",
]
dev = [
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "rpdb>=0.2.0",
    "ruff>=0.15.2",
]

[project.entry-points.'nat.plugins']
nat_agent = "dragent.nat.register"
langgraph_agent = "dragent.langgraph.register"
crewai_agent = "dragent.crewai.register"
llamaindex_agent = "dragent.llamaindex.register"
base_agent = "dragent.base.register"

[tool.uv]
package = true
exclude-dependencies = [
    "annoy",                    # nemoguardrails ANN index; sdist -march=native build SIGILLs on non-AVX-512 runners (BUZZOK-31265)
    "llama-index-llms-azure-openai",
    "llama-index-llms-bedrock",
    "llama-index-llms-nvidia",
    "llama-index-llms-openai",
    "uv",                       # package manager bundled by crewai; runtime unnecessary
    "langchain-milvus",         # Milvus vector DB adapter pulled in by nvidia-nat-langchain; not used
    "pymilvus",                 # Milvus client pulled in by langchain-milvus; not used
    "flask",                    # web framework pulled in by nvidia-nat 1.6.0; not used
    # crewai / crewai-tools bloat
    "build",                    # Python build system pulled in by crewai; runtime unnecessary
    "kubernetes",               # K8s client pulled in by crewai-tools; not used
    "stagehand",                # Playwright web automation pulled in by crewai-tools; not used
    "pytube",                   # YouTube downloader pulled in by crewai-tools; not used
    "youtube-transcript-api",   # YouTube transcripts pulled in by crewai-tools; not used
    "lancedb",                  # optional vector DB pulled in by crewai; not used
    "openpyxl",                 # Excel parser pulled in by crewai-tools; not used
    "python-docx",              # Word doc parser pulled in by crewai-tools; not used
    # llama-index / mem0ai bloat
    "llama-index-cli",          # CLI tool pulled in by llama-index; not needed at runtime
]
# cve-sync:begin
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "authlib>=1.7.1",
    "banks>=2.4.5",
    "bleach>=6.4.0",
    "h2>=4.4.1",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.10",
    "langchain>=1.3.9",
    "langchain-classic>=1.0.7",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langsmith>=0.8.18",
    "mistune>=3.3.3",
    "nltk>=3.10.3",
    "notebook>=7.5.6",
    "openai>=2.30.0",
    "pdfminer.six>=20251230",
    "pillow>=12.3.0",
    "pip>=26.2",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "pypdf>=6.16.1",
    "pytest>=9.0.3",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "tornado>=6.5.8",
    "urllib3>=2.7.0",
]
override-dependencies = [
    "click>=8.3.3",
    "crewai>=1.11.0",
    "cryptography>=50.0.0",
    "json-repair>=0.60.1",
    "litellm>=1.91.1,<2.0.0",
    "mcp>=1.28.1",
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-common>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2.0.0",
    "opentelemetry-instrumentation>=0.64b0,<0.65",
    "opentelemetry-sdk>=1.43.0,<2.0.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.2.2,<2.0.0",
]
# cve-sync:end

[tool.uv.sources]
datarobot-genai = { path = "../", editable = true }

[tool.mypy]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
pretty = true
show_absolute_path = true

[tool.pytest.ini_options]
timeout = 300

[tool.ruff]
line-length = 100
indent-width = 4

[tool.setuptools]
packages = ["dragent", "drmcp"]

[tool.ruff.lint]
select = [
    "E",  # Pyflakes
    "F",  # pycodestyle
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle
    "PL", # pylint
    "UP", # pyupgrade
    "INP", # check missing __init__.py
    "B006", # mutable-argument-default
]
extend-ignore = [
    # D100-D106: Ignore undocumented module, class, method, function & inner class
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
    # 1 blank line required between summary line and description
    "D205",
    # Too many arguments
    "PLR0913",
    # Too many statements
    "PLR0915",
    # Too many branches
    "PLR0912",
    # inline imports
    "PLC0415",
    # assigning a lambda
    "E731",
]
fixable = [
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "F401", # Imported but unused
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "D104", # Missing docstring in public package
    "F401"  # Imported but unused
]


[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "bytes"]
max-args = 8
